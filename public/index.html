<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TSP Solver</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
	<script src="sketch.js"></script>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css"
		integrity="sha256-sA+zWATbFveLLNqWO2gtiw3HL/lh1giY/Inf1BJ0z14=" crossorigin="" />
	<link rel="stylesheet" href="styles.css" />
	<!-- Make sure you put this AFTER Leaflet's CSS -->
	<script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js"
		integrity="sha256-o9N1jGDZrf5tS+Ft4gbIK7mYMipq9lqpVJ91xHSyKhg=" crossorigin=""></script>
	<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"
		integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+"
		crossorigin="anonymous"></script>

</head>

<body>
	<div id="map"></div>

	<div class="panel">
		<div class="panel-body">
		<section id="addrSection">
			<h2>Addresses</h2>
			<div class="seg">
				<button id="segManual" class="active" onclick="setAddrMode('manual')">Type manually</button>
				<button id="segUpload" onclick="setAddrMode('upload')">Upload file</button>
			</div>
			<div id="manualPane">
				<div class="addr-grid" id="addrGrid"></div>
			</div>
			<div id="uploadPane" class="hidden">
				<div class="upload-pane">
					<div class="upload-head">
						<span class="upload-label">Upload address list</span>
						<span class="info-icon" id="infoIcon">i</span>
						<div class="popover" id="infoPop">
							<div class="title">File format:</div>
							<ul>
								<li>Up to 10 addresses</li>
								<li>One address per line</li>
								<li>No headers</li>
							</ul>
						</div>
					</div>
					<div class="dropzone" id="dropzone">
						<div class="icon">📄</div>
						<div class="main">Drag &amp; drop a text file here</div>
						<div class="sub">.txt or .csv · one address per line</div>
						<div class="or">or</div>
						<button class="choose" id="chooseBtn">Choose a file</button>
						<input type="file" id="fileInput" accept="text/*,.csv" style="display:none" />
					</div>
					<div class="upload-note" id="uploadNote"></div>
				</div>
			</div>
		</section>

		<section id="algoSection">
			<h2>Algorithm</h2>

			<div class="ga-row">
				<div class="field">
					<label for="population">Population</label>
					<select id="population"></select>
				</div>
				<div class="field">
					<label for="acc">Generations</label>
					<select id="acc"></select>
				</div>
				<div class="field">
					<label for="mr">Mutation</label>
					<select id="mr"></select>
				</div>
			</div>

			<div class="op-row">
				<div class="op-group">
					<label>Units</label>
					<div class="seg" id="unitsSeg">
						<button id="unitMi" class="active" onclick="setUnits('mi')">mi</button>
						<button id="unitKm" onclick="setUnits('km')">km</button>
					</div>
				</div>
				<div class="op-group">
					<label>Objective</label>
					<div class="seg" id="objSeg">
						<button id="objDistance" class="active" onclick="setObjective('distance')">dist</button>
						<button id="objDuration" onclick="setObjective('duration')">time</button>
					</div>
				</div>
			</div>

			<div class="avoid-row">
				<label class="toggle-row">
					<span class="toggle-label">Avoid tolls</span>
					<span class="toggle">
						<input type="checkbox" id="avoid-tolls" />
						<span class="toggle-track"></span>
					</span>
				</label>
				<label class="toggle-row">
					<span class="toggle-label">Avoid ferries</span>
					<span class="toggle">
						<input type="checkbox" id="avoid-ferries" />
						<span class="toggle-track"></span>
					</span>
				</label>
			</div>

			<div class="controls">
				<button class="btn btn-primary" id="submit" onclick="getAddress()">Solve route</button>
				<button class="btn btn-ghost" id="reset" onclick="resetAll()">Reset</button>
			</div>
			<div class="progress-row">
				<div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
				<div class="progress-label" id="plabel">Idle</div>
			</div>
			<div class="progress-label" id="liveDist" hidden>Best so far: —</div>
		</section>

		<section id="resultsSection" class="hidden">
			<h2>Results</h2>
			<div class="summary-row">
				<div class="stat">
					<div class="k" id="distLabel">Total distance</div>
					<div class="v" id="dist">—</div>
				</div>
				<div class="stat">
					<div class="k" id="timeLabel">Total time</div>
					<div class="v" id="time">—</div>
				</div>
			</div>
			<div class="segments-wrap">
				<table class="segments-table">
					<thead>
						<tr>
							<th>#</th>
							<th>From → To</th>
							<th>Dist</th>
							<th>Time</th>
						</tr>
					</thead>
					<tbody id="segments"></tbody>
				</table>
			</div>
			<div class="ferry-note hidden" id="ferryNote"></div>
			<div class="ferry-note hidden" id="unreachableNote"></div>
			<div class="controls">
				<button class="btn btn-ghost" id="animBtn" onclick="startRouteAnimation()" hidden>Animate route</button>
			</div>
		</section>
		</div>

		<div class="resize-handle" id="resizeHandle"></div>
	</div>
</body>

</html>
